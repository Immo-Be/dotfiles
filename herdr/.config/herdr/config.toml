# Herdr config mirroring the practical parts of tmux/.tmux.conf.

onboarding = false

[theme]
name = "catppuccin"

auto_switch = false
[terminal]
default_shell = "zsh"
shell_mode = "login"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

reload_config = "prefix+r"

new_tab = "prefix+c"
previous_tab = ["prefix+p", "alt+shift+h"]
next_tab = ["prefix+n", "alt+shift+l"]
switch_tab = "prefix+1..9"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
copy_mode = "prefix+["
resize_mode = "prefix+shift+r"
detach = "prefix+q"

[[keys.command]]
key = "prefix+y"
type = "pane"
command = "$HOME/.local/bin/yad"
description = "open yad"

[[keys.command]]
key = "prefix+o"
type = "pane"
command = "opencode"
description = "open opencode"

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "nvim -c 'Neogit'"
description = "open Neogit"

[[keys.command]]
key = "prefix+shift+v"
type = "pane"
command = "cd $HOME/Documents/notes_vault && nvim"
description = "open notes vault"

[ui]
mouse_capture = true
pane_borders = true
pane_gaps = false
prompt_new_tab_name = false
accent = "#f5c2e7"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false

[advanced]
scrollback_limit_bytes = 10000000
